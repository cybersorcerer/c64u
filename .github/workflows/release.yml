name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux-windows:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Video and audio stream need Ebiten and oto, which on Linux reach X11
          # and ALSA through cgo. Only the native amd64 build gets them: arm64 is
          # cross-compiled here, where cgo would need a second toolchain, and the
          # build tags fall back to the stubs whenever cgo is off.
          - goos: linux
            goarch: amd64
            asset: c64u_Linux_x86_64.tar.gz
            cgo: 1
          - goos: linux
            goarch: arm64
            asset: c64u_Linux_arm64.tar.gz
            cgo: 0
          - goos: windows
            goarch: amd64
            asset: c64u_Windows_x86_64.zip
            cgo: 0

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install stream build dependencies
        if: matrix.cgo == 1
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl1-mesa-dev xorg-dev

      - name: Build
        working-directory: tools/c64u
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          VERSION=$(git describe --tags --always --dirty)
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BINARY=c64u
          [ "${{ matrix.goos }}" = "windows" ] && BINARY=c64u.exe
          go build \
            -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}" \
            -o ${BINARY} ./cmd/c64u

      - name: Package (tar.gz)
        if: matrix.goos != 'windows'
        working-directory: tools/c64u
        run: tar czf ${{ matrix.asset }} c64u -C ../.. README.md

      - name: Package (zip)
        if: matrix.goos == 'windows'
        working-directory: tools/c64u
        run: |
          cp ../../README.md .
          zip ${{ matrix.asset }} c64u.exe README.md
          rm README.md

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: tools/c64u/${{ matrix.asset }}

  build-darwin:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            asset: c64u_Darwin_x86_64.tar.gz
          - goarch: arm64
            asset: c64u_Darwin_arm64.tar.gz

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        working-directory: tools/c64u
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          # Ebitengine's Metal backend still calls CVDisplayLink, deprecated in
          # macOS 15. The warnings come from the dependency and would otherwise
          # fill the build log on every release.
          CGO_CFLAGS: -Wno-deprecated-declarations
        run: |
          VERSION=$(git describe --tags --always --dirty)
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          go build \
            -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}" \
            -o c64u ./cmd/c64u

      - name: Package
        working-directory: tools/c64u
        run: tar czf ${{ matrix.asset }} c64u -C ../.. README.md

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: tools/c64u/${{ matrix.asset }}

  # The skill archives are platform independent, so one job produces both.
  # Kick Assembler is fetched to assemble every example before packaging: a
  # skill that ships a broken example must fail the release, not reach users.
  package-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Kick Assembler
        run: |
          curl -fsSL -o /tmp/kickass.zip https://theweb.dk/KickAssembler/KickAssembler.zip
          mkdir -p /tmp/kickass
          unzip -q /tmp/kickass.zip -d /tmp/kickass

      - name: Verify and package skills
        run: make -C skills dist KICKASS=/tmp/kickass/KickAss.jar

      - uses: actions/upload-artifact@v4
        with:
          name: c64u-skills
          path: skills/dist/*

  # The cartridge needs Kick Assembler to assemble and Go for the .crt wrapper,
  # so building it from source is out of reach for anyone who just wants to use
  # it. Shipping the finished wedge.crt with the release removes that.
  build-wedge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install Kick Assembler
        run: |
          curl -fsSL -o /tmp/kickass.zip https://theweb.dk/KickAssembler/KickAssembler.zip
          mkdir -p /tmp/kickass
          unzip -q /tmp/kickass.zip -d /tmp/kickass

      - name: Build the cartridge
        run: make -C c64/wedge KICKASS=/tmp/kickass/KickAss.jar

      - uses: actions/upload-artifact@v4
        with:
          name: wedge-cartridge
          path: c64/wedge/build/wedge.crt

  release:
    runs-on: ubuntu-latest
    needs: [build-linux-windows, build-darwin, package-skills, build-wedge]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "c64u ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            ### Agent skills

            `c64u-skills.tar.gz` and `c64u-skills.zip` contain the C64 knowledge
            skills in the [Agent Skills](https://agentskills.io/) format, usable
            from Claude Code, Codex CLI, opencode, pi, Hermes, ChatGPT and other
            compatible agents:

            ```sh
            mkdir -p ~/.agents/skills
            tar xzf c64u-skills.tar.gz -C ~/.agents/skills
            ```

            For ChatGPT, upload the per-skill archive `c64-knowledge.zip` in
            Settings instead.

            See [skills/README.md](https://github.com/cybersorcerer/c64u/blob/main/skills/README.md)
            for per-tool directories and other install methods.

            ### Ultimate wedge cartridge

            `wedge.crt` adds `@` commands for the Ultimate filesystem to stock
            Commodore BASIC. It needs no build tools:

            ```sh
            c64u fs upload wedge.crt /Flash/carts/wedge.crt
            c64u config set "C64 and Cartridge Settings" Cartridge wedge.crt
            c64u config save-to-flash
            ```

            See [c64/wedge/README.md](https://github.com/cybersorcerer/c64u/blob/main/c64/wedge/README.md).
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/wedge.crt
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
