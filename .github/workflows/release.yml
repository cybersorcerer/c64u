name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-linux-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run GoReleaser (Linux + Windows)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --split
          workdir: tools/c64u
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOS: linux

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-windows
          path: tools/c64u/dist/

  release-darwin:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run GoReleaser (macOS)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --split
          workdir: tools/c64u
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOS: darwin

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-darwin
          path: tools/c64u/dist/

  release-merge:
    runs-on: ubuntu-latest
    needs: [release-linux-windows, release-darwin]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Download Linux/Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-linux-windows
          path: tools/c64u/dist/

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-darwin
          path: tools/c64u/dist/

      - name: Merge and publish release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: continue --merge
          workdir: tools/c64u
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
