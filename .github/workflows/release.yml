name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux-windows:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset: c64u_Linux_x86_64.tar.gz
          - goos: linux
            goarch: arm64
            asset: c64u_Linux_arm64.tar.gz
          - goos: windows
            goarch: amd64
            asset: c64u_Windows_x86_64.zip

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        working-directory: tools/c64u
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION=$(git describe --tags --always --dirty)
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BINARY=c64u
          [ "${{ matrix.goos }}" = "windows" ] && BINARY=c64u.exe
          go build \
            -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}" \
            -o ${BINARY} ./cmd/c64u

      - name: Package (tar.gz)
        if: matrix.goos != 'windows'
        working-directory: tools/c64u
        run: tar czf ${{ matrix.asset }} c64u -C ../.. README.md

      - name: Package (zip)
        if: matrix.goos == 'windows'
        working-directory: tools/c64u
        run: |
          cp ../../README.md .
          zip ${{ matrix.asset }} c64u.exe README.md
          rm README.md

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: tools/c64u/${{ matrix.asset }}

  build-darwin:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            asset: c64u_Darwin_x86_64.tar.gz
          - goarch: arm64
            asset: c64u_Darwin_arm64.tar.gz

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        working-directory: tools/c64u
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          VERSION=$(git describe --tags --always --dirty)
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          go build \
            -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}" \
            -o c64u ./cmd/c64u

      - name: Package
        working-directory: tools/c64u
        run: tar czf ${{ matrix.asset }} c64u -C ../.. README.md

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: tools/c64u/${{ matrix.asset }}

  # The skill archives are platform independent, so one job produces both.
  # Kick Assembler is fetched to assemble every example before packaging: a
  # skill that ships a broken example must fail the release, not reach users.
  package-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Kick Assembler
        run: |
          curl -fsSL -o /tmp/kickass.zip https://theweb.dk/KickAssembler/KickAssembler.zip
          mkdir -p /tmp/kickass
          unzip -q /tmp/kickass.zip -d /tmp/kickass

      - name: Verify and package skills
        run: make -C skills dist KICKASS=/tmp/kickass/KickAss.jar

      - uses: actions/upload-artifact@v4
        with:
          name: c64u-skills
          path: skills/dist/*

  release:
    runs-on: ubuntu-latest
    needs: [build-linux-windows, build-darwin, package-skills]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "c64u ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            ### Agent skills

            `c64u-skills.tar.gz` and `c64u-skills.zip` contain the C64 knowledge
            skills in the [Agent Skills](https://agentskills.io/) format, usable
            from Claude Code, Codex CLI, opencode, pi, Hermes, ChatGPT and other
            compatible agents:

            ```sh
            mkdir -p ~/.agents/skills
            tar xzf c64u-skills.tar.gz -C ~/.agents/skills
            ```

            For ChatGPT, upload the per-skill archive `c64-knowledge.zip` in
            Settings instead.

            See [skills/README.md](https://github.com/cybersorcerer/c64u/blob/main/skills/README.md)
            for per-tool directories and other install methods.
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
